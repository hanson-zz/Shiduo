name: 截图

# 手动运行：用演示数据启动拾掇，自动截下各个页面（中文和英文各一套），提交到 docs/screenshots 和 docs/screenshots/en。
# 默认推到 screenshots-wip 分支先检查；branch 填 main 直接更新官网。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 截图提交到哪个分支（main 直接更新官网；默认先放到 screenshots-wip 检查）
        default: screenshots-wip
      pages:
        description: 只截这些页面（空 = 全部；格式 page:light|dark:输出名[:win|small|panel|region]，空格分隔）
        default: ""

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --quiet xcodegen

      - name: 构建
        run: |
          xcodegen generate
          xcodebuild build -project Shiduo.xcodeproj -scheme Shiduo -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > build.log 2>&1 || { grep -E "error:" build.log | head -80; exit 1; }
          swiftc -O scripts/window-id.swift -o window-id

      - name: 截图
        run: |
          exec > >(tee shot.log) 2>&1
          set -x
          system_profiler SPDisplaysDataType | grep -i resolution || true
          BIN=build/Build/Products/Release/Shiduo.app/Contents/MacOS/Shiduo
          mkdir -p docs/screenshots
          # 关掉可能挡住窗口的东西
          osascript -e 'tell application "System Events" to set visible of every process whose visible is true and name is not "Finder" to false' || true
          # shoot <page> <light|dark> <输出名> [zh|en] [win|small|panel|region]：中文图存 docs/screenshots，英文图存 docs/screenshots/en。
          #   win：主窗口（含弹出的面板）；small：最小的那个窗口（设置、图片工具、卸载 App），带阴影；
          #   panel：浮在最上层的面板（刘海暂存架），带阴影；region：按主窗口的位置截屏幕区域（连同气泡弹窗）。
          # 都加 --pro：走正常的「开始 7 天免费试用」，Pro 页面是解锁后的样子。
          shoot() {
            local page=$1 mode=$2 out=$3 lang=${4:-zh} cap=${5:-win}
            local extra="" dir=docs/screenshots langarg="zh-Hans" wait=9
            [ "$mode" = dark ] && extra="--dark"
            if [ "$lang" = en ]; then dir=docs/screenshots/en; langarg="en"; fi
            case "$page" in studio-*|uninstall|notch*) wait=14 ;; esac
            mkdir -p "$dir"
            "$BIN" -AppleLanguages "($langarg)" --demo --pro --page="$page" $extra &
            local pid=$!
            sleep $wait
            ./window-id $pid --list || true
            local flag=""
            [ "$cap" = small ] && flag="--smallest"
            [ "$cap" = panel ] && flag="--panel"
            if [ "$cap" = region ]; then
              local b
              b=$(./window-id $pid --bounds) || { echo "NO WINDOW $page $lang"; kill $pid; return 0; }
              screencapture -x -R "$b" "$dir/$out.png"
            else
              local wid
              wid=$(./window-id $pid $flag) || { echo "NO WINDOW $page $lang"; kill $pid; return 0; }
              if [ "$cap" = win ]; then
                screencapture -x -o -l "$wid" "$dir/$out.png"
              else
                screencapture -x -l "$wid" "$dir/$out.png"
              fi
              # 偶尔会截到一条很矮的窗口（例如标题栏），再等一会儿重截一次。
              if [ "$(sips -g pixelHeight "$dir/$out.png" | awk '/pixelHeight/{print $2}')" -lt 120 ]; then
                echo "TOO SMALL $page $lang, retrying"
                sleep 6
                wid=$(./window-id $pid $flag) && screencapture -x -l "$wid" "$dir/$out.png"
              fi
            fi
            kill $pid || true
            sleep 2
          }
          PAGES="${{ inputs.pages }}"
          [ -z "$PAGES" ] && PAGES="home:light:home home:dark:home-dark today:light:today:region images:light:images search:light:search downloads:light:downloads organize:light:organize organize-group:light:organize-group cleanup:light:cleanup review:light:review history:light:history duplicates:light:duplicates similar:light:similar music:light:music suggest:light:suggest onboarding:light:onboarding storagemap:light:storagemap rename:light:rename convert:light:convert shelf:light:shelf notch:light:notch:panel notch-convert:light:notch-convert:panel folderwall:light:folderwall foldercolor:light:foldercolor moveout:light:moveout uninstall:light:uninstall:small studio-stitch:light:studio-stitch:small studio-beautify:light:studio-beautify:small studio-annotate:light:studio-annotate:small studio-cutout:light:studio-cutout:small studio-upscale:light:studio-upscale:small settings:light:settings:small"
          for lang in zh en; do
            shoot home light warmup $lang   # 冷启动预热，首张截图常停在加载中
            rm -f docs/screenshots/warmup.png docs/screenshots/en/warmup.png
            for spec in $PAGES; do
              IFS=: read -r page mode out cap <<< "$spec"
              shoot "$page" "$mode" "$out" "$lang" "${cap:-win}"
            done
          done
          ls -la docs/screenshots docs/screenshots/en

      - name: 上传为构件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

      - name: 提交截图
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "更新截图 [skip ci]" || exit 0
          if [ "${{ inputs.branch }}" = main ]; then git push; else git push -f origin HEAD:"${{ inputs.branch }}"; fi

      - name: 失败日志
        if: always()
        run: |
          { grep -E "error:" build.log | head -60 || true; cat shot.log 2>/dev/null; } > /tmp/err.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$(mktemp -d)" && git init -q && cp /tmp/err.txt shot-log.txt
          git add shot-log.txt && git commit -qm "screenshot log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs || true
