name: 截图

# 手动运行：用演示数据启动拾掇，自动截下各个页面，提交到 docs/screenshots。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --quiet xcodegen

      - name: 构建
        run: |
          xcodegen generate
          xcodebuild build -project Shiduo.xcodeproj -scheme Shiduo -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > build.log 2>&1 || { grep -E "error:" build.log | head -80; exit 1; }
          swiftc -O scripts/window-id.swift -o window-id

      - name: 截图
        run: |
          exec > >(tee shot.log) 2>&1
          set -x
          BIN=build/Build/Products/Release/Shiduo.app/Contents/MacOS/Shiduo
          mkdir -p docs/screenshots
          # 关掉可能挡住窗口的东西
          osascript -e 'tell application "System Events" to set visible of every process whose visible is true and name is not "Finder" to false' || true
          shoot() {
            local page=$1 mode=$2 out=$3
            local extra=""
            [ "$mode" = dark ] && extra="--dark"
            "$BIN" --demo --page="$page" $extra &
            local pid=$!
            sleep 9
            local wid
            ./window-id $pid || true
            wid=$(./window-id $pid) || { echo "NO WINDOW $page"; kill $pid; return 0; }
            screencapture -x -o -l "$wid" "docs/screenshots/$out.png"
            kill $pid || true
            sleep 2
          }
          shoot home light warmup   # 冷启动预热，首张截图常停在加载中
          rm -f docs/screenshots/warmup.png
          shoot home light home
          shoot home dark home-dark
          shoot images light images
          shoot search light search
          shoot downloads light downloads
          shoot cleanup light cleanup
          shoot duplicates light duplicates
          shoot similar light similar
          shoot review light review
          shoot music light music
          shoot suggest light suggest
          shoot onboarding light onboarding
          shoot storagemap light storagemap
          shoot rename light rename
          shoot convert light convert
          ls -la docs/screenshots

      - name: 上传为构件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

      - name: 提交截图
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "更新截图 [skip ci]" || exit 0
          git push

      - name: 失败日志
        if: always()
        run: |
          { grep -E "error:" build.log | head -60 || true; cat shot.log 2>/dev/null; } > /tmp/err.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$(mktemp -d)" && git init -q && cp /tmp/err.txt shot-log.txt
          git add shot-log.txt && git commit -qm "screenshot log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs || true
