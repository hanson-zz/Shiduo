name: 截图

# 手动运行：用演示数据启动拾掇，自动截下各个页面（中文和英文各一套），提交到 docs/screenshots 和 docs/screenshots/en。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --quiet xcodegen

      - name: 构建
        run: |
          xcodegen generate
          xcodebuild build -project Shiduo.xcodeproj -scheme Shiduo -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > build.log 2>&1 || { grep -E "error:" build.log | head -80; exit 1; }
          swiftc -O scripts/window-id.swift -o window-id

      - name: 截图
        run: |
          exec > >(tee shot.log) 2>&1
          set -x
          BIN=build/Build/Products/Release/Shiduo.app/Contents/MacOS/Shiduo
          mkdir -p docs/screenshots
          # 关掉可能挡住窗口的东西
          osascript -e 'tell application "System Events" to set visible of every process whose visible is true and name is not "Finder" to false' || true
          # shoot <page> <light|dark> <输出名> [zh|en]：中文图存 docs/screenshots，英文图存 docs/screenshots/en。
          shoot() {
            local page=$1 mode=$2 out=$3 lang=${4:-zh}
            local extra="" dir=docs/screenshots langarg="zh-Hans"
            [ "$mode" = dark ] && extra="--dark"
            if [ "$lang" = en ]; then dir=docs/screenshots/en; langarg="en"; fi
            mkdir -p "$dir"
            "$BIN" --demo --page="$page" $extra -AppleLanguages "($langarg)" &
            local pid=$!
            sleep 9
            local wid
            ./window-id $pid || true
            wid=$(./window-id $pid) || { echo "NO WINDOW $page $lang"; kill $pid; return 0; }
            screencapture -x -o -l "$wid" "$dir/$out.png"
            kill $pid || true
            sleep 2
          }
          PAGES="home:light:home home:dark:home-dark images:light:images search:light:search downloads:light:downloads cleanup:light:cleanup duplicates:light:duplicates similar:light:similar review:light:review music:light:music suggest:light:suggest onboarding:light:onboarding storagemap:light:storagemap rename:light:rename convert:light:convert"
          for lang in zh en; do
            shoot home light warmup $lang   # 冷启动预热，首张截图常停在加载中
            rm -f docs/screenshots/warmup.png docs/screenshots/en/warmup.png
            for spec in $PAGES; do
              IFS=: read -r page mode out <<< "$spec"
              shoot "$page" "$mode" "$out" "$lang"
            done
          done
          ls -la docs/screenshots docs/screenshots/en

      - name: 上传为构件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots

      - name: 提交截图
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "更新截图 [skip ci]" || exit 0
          git push

      - name: 失败日志
        if: always()
        run: |
          { grep -E "error:" build.log | head -60 || true; cat shot.log 2>/dev/null; } > /tmp/err.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$(mktemp -d)" && git init -q && cp /tmp/err.txt shot-log.txt
          git add shot-log.txt && git commit -qm "screenshot log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs || true
