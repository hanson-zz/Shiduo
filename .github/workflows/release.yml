name: 发布

# 推送 v 开头的标签（例如 v0.1.0）时，自动构建并发布 DMG。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签，例如 v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --quiet xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 计算构建号
        run: |
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          # 只按 主.次.补丁 算出来的号：同一版本的所有 beta 都一样（0.14.1-beta.* 全是 1401）。
          # project.yml 的 CURRENT_PROJECT_VERSION（每个 beta 递增，例如 beta.5 = 1405）更大时用它，构建号才对得上、只增不减。
          FORMULA=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          PROJECT_BUILD="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"?([0-9]+)"?.*/\1/p' project.yml | head -1)"
          BUILD="$FORMULA"
          if [ -n "$PROJECT_BUILD" ] && [ "$PROJECT_BUILD" -gt "$FORMULA" ]; then BUILD="$PROJECT_BUILD"; fi
          echo "构建号：公式 $FORMULA，project.yml ${PROJECT_BUILD:-无}，用 $BUILD"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: 构建 Release（通用二进制）
        run: |
          xcodebuild build \
            -project Shiduo.xcodeproj \
            -scheme Shiduo \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            > build.log 2>&1 || { grep -E "error:" build.log | head -80; exit 1; }
          lipo -info build/Build/Products/Release/Shiduo.app/Contents/MacOS/Shiduo

      - name: 签名（固定的自签名证书，没有就退回 ad-hoc）
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: scripts/sign-app.sh build/Build/Products/Release/Shiduo.app

      - name: 打包 DMG 和 ZIP
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          APP=build/Build/Products/Release/Shiduo.app
          ditto -c -k --keepParent "$APP" "Shiduo-${TAG}.zip"
          # 带背景图的 DMG（左边拾掇，右边“应用程序”，附首次打开指南）；
          # create-dmg 失败时脚本会自动退回普通 hdiutil 打包，不会让发布中断。
          if [ -x scripts/dmg/make-dmg.sh ]; then
            brew install --quiet create-dmg || true
            scripts/dmg/make-dmg.sh "$APP" "$TAG" "Shiduo-${TAG}.dmg"
          else
            STAGE="$(mktemp -d)/Shiduo"
            mkdir -p "$STAGE"
            ditto "$APP" "$STAGE/拾掇.app"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "拾掇 ${TAG}" -srcfolder "$STAGE" -ov -format UDZO "Shiduo-${TAG}.dmg"
          fi
          # 固定文件名的副本：官网按钮用 releases/latest/download/Shiduo.dmg 直接下载最新正式版。
          cp "Shiduo-${TAG}.dmg" Shiduo.dmg

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## 下载

          下载下面的 `Shiduo-*.dmg`，打开后把“拾掇”拖进“应用程序”文件夹。

          ## 系统要求

          - macOS 14 Sonoma 或更新版本
          - Apple 芯片和 Intel 芯片的 Mac 都可以

          ## 第一次打开

          拾掇是开源软件，没有经过 Apple 公证，第一次打开时系统会拦截一下（只需要处理一次）：

          1. 在“访达 ▸ 应用程序”里右键点按（或按住 Control 点按）“拾掇”，选“打开”，再点“打开”
          2. 如果提示“Apple 无法验证…”且没有“打开”按钮（macOS 15 Sequoia 常见）：先点“完成”，打开“系统设置 ▸ 隐私与安全性”，滚动到底部点“仍要打开”，输入开机密码
          3. 也可以在“终端”里运行：`xattr -dr com.apple.quarantine /Applications/拾掇.app`

          图文步骤见 DMG 里的“首次打开请看我.png”，或 https://shiduo.app/#first-open

          ## 更新后的权限

          v0.13.1 之后的版本改用固定的自签名证书签名。如果你是从 v0.13.1 或更早的版本升级上来，需要最后一次重新授权“完全磁盘访问权限”（App 里会弹出指引）：在“系统设置 ▸ 隐私与安全性 ▸ 完全磁盘访问权限”里删掉旧的“拾掇”，再点“+”重新添加。以后的更新不用再弄。

          ## 隐私

          所有扫描、文字识别和查重都在本机完成。唯一的联网功能是“检查更新”，默认关闭。
          EOF
          sed -i '' 's/^          //' notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "Shiduo-${TAG}.dmg" "Shiduo-${TAG}.zip" Shiduo.dmg --clobber
          else
            gh release create "$TAG" "Shiduo-${TAG}.dmg" "Shiduo-${TAG}.zip" Shiduo.dmg \
              --title "拾掇 ${TAG}" --notes-file notes.md
          fi
