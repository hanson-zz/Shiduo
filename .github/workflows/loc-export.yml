name: 导出本地化

# 临时：导出所有需要翻译的字符串（xliff），推到 loc-export 分支，用来核对 key 和格式符。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install --quiet xcodegen
      - name: 导出
        run: |
          xcodegen generate
          xcodebuild -exportLocalizations -project Shiduo.xcodeproj -localizationPath out \
            -exportLanguage en -exportLanguage zh-Hans \
            SWIFT_EMIT_LOC_STRINGS=YES CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > export.log 2>&1 || true
          ls -R out | head -50 || true
      - name: 构建并检查英文字符串
        run: |
          xcodebuild build -project Shiduo.xcodeproj -scheme Shiduo -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" > build.log 2>&1 || { grep -E "error:" build.log | head -40 > check.txt; exit 0; }
          APP=build/Build/Products/Release/Shiduo.app
          cat > check.swift <<'SWIFT'
          import Foundation
          // 用本进程的语言设置（-AppleLanguages）去查 App 的字符串表，和 App 自己的查找逻辑（含回退）一致。
          let b = Bundle(path: CommandLine.arguments[1])!
          func t(_ k: String) -> String { b.localizedString(forKey: k, value: nil, table: nil) }
          print("== preferred:", b.preferredLocalizations)
          print(String.localizedStringWithFormat(t("%lld 个项目"), 1), "|", String.localizedStringWithFormat(t("%lld 个项目"), 5))
          print(String.localizedStringWithFormat(t("%lld 个多余的副本，共 %lld 组"), 4, 2))
          print(t("清理"), "|", t("sidebar.pictures"), "|", t("kind.file"), "|", t("跟随系统"), "|", t("首页"))
          print(b.localizedString(forKey: "CFBundleDisplayName", value: nil, table: "InfoPlist"))
          SWIFT
          sed -i '' 's/^          //' check.swift
          swiftc check.swift -o check
          : > check.txt
          for L in en zh-Hans fr zh-Hant; do ./check "$APP" -AppleLanguages "($L)" >> check.txt 2>&1 || true; done
          ls "$APP/Contents/Resources" >> check.txt
          cat check.txt
      - name: 推到 loc-export 分支
        if: always()
        run: |
          D=$(mktemp -d)
          cp -R out "$D/out" 2>/dev/null || true
          grep -nE "error:|warning:" export.log | head -200 > "$D/export-errors.txt" || true
          tail -50 export.log > "$D/export-tail.txt" || true
          cp check.txt "$D/check.txt" 2>/dev/null || true
          cd "$D" && git init -q
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "loc export ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:loc-export
