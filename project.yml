name: Shiduo
options:
  bundleIdPrefix: io.github.hanson-zz
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.14.1-beta.4"
    CURRENT_PROJECT_VERSION: "1404"
    DEAD_CODE_STRIPPING: YES
    # 界面支持简体中文和英文：代码里的中文是 key，英文翻译在 Resources/Localizable.xcstrings。
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # 默认 ad-hoc 签名（"-"），不需要 Apple 开发者证书，任何人 clone 后都能直接构建。
    # 发布的版本会再用固定的自签名证书重新签名（scripts/sign-app.sh），这样更新后系统权限不会丢，见 notes/signing.md。
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Shiduo:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
          - "ThemeIcons/**"
          - "AltAppIcons/**"
      # 「文件夹换装」的主题图标：整个文件夹原样拷进 App（ThemeIcons/<分类>/<名字>.png）。
      - path: Resources/ThemeIcons
        type: folder
        buildPhase: resources
      # 设置 › 外观 › 应用图标（Pro）：备选程序坞图标，整个文件夹原样拷进 App（AltAppIcons/<id>.png）。
      # 放一张新的 PNG 进去就多一款，不用改代码（规格见 notes/todo.md）。
      - path: Resources/AltAppIcons
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Shiduo
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hanson-zz.shiduo
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShiduoTests:
    type: bundle.unit-test
    platform: macOS
    # 只编译纯逻辑部分（自然语言搜索解析），不需要启动整个应用。
    sources:
      - path: Tests
      - path: Sources/Search/SearchQuery.swift
      - path: Sources/Search/QueryParser.swift
      - path: Sources/Search/SavedSearch.swift
      - path: Sources/Search/Pinyin.swift
      - path: Sources/Model/FileCategory.swift
      - path: Sources/Model/ScreenshotNameRules.swift
      - path: Sources/Model/ScreenshotSourceLogic.swift
      - path: Sources/Model/SourceCatalog.swift
      - path: Sources/Model/DownloadSourceLogic.swift
      - path: Sources/Model/FileStamp.swift
      - path: Sources/Model/PathLogic.swift
      - path: Sources/Model/LibraryScopeLogic.swift
      - path: Sources/Model/LibraryLoadLogic.swift
      - path: Sources/Model/FolderSizeLogic.swift
      - path: Sources/Model/FullDiskAccessLogic.swift
      - path: Sources/Model/ListTruncationLogic.swift
      - path: Sources/Model/NavigationHistoryLogic.swift
      - path: Sources/Model/TabsLogic.swift
      - path: Sources/App/AppShortcuts.swift
      - path: Sources/Services/DuplicateSafety.swift
      - path: Sources/Services/OCRCacheKeys.swift
      - path: Sources/Pro/PhotoConcepts.swift
      - path: Sources/Pro/License.swift
      - path: Sources/Pro/LicenseStore.swift
      - path: Sources/Pro/LicenseStoreLogic.swift
      - path: Sources/Pro/TrialLogic.swift
      - path: Sources/Pro/ShakeDetector.swift
      - path: Sources/Services/CleanupHistory.swift
      - path: Sources/Pro/FolderIconStyle.swift
      - path: Sources/Services/FinderTagEntries.swift
      - path: Sources/Pro/MediaToolsLogic.swift
      - path: Sources/Pro/UninstallLogic.swift
      - path: Sources/Pro/StitchLogic.swift
      - path: Sources/Pro/AnnotateLogic.swift
      - path: Sources/Pro/ImageExportLogic.swift
      - path: Sources/Pro/ShortcutLogic.swift
      - path: Sources/Pro/MoveOutLogic.swift
      - path: Sources/Pro/DownloadsPlanLogic.swift
      - path: Sources/Services/FileUndoLogic.swift
      - path: Sources/Model/TodayAddedLogic.swift
      - path: Sources/Model/TrashConfirmLogic.swift
      - path: Sources/Pro/UnlockCelebrationLogic.swift
      - path: Sources/Model/FolderArtLogic.swift
      - path: Sources/Model/SmartCleanupLogic.swift
      - path: Sources/Model/HoverPreviewLogic.swift
      - path: Sources/Model/SizeSortLogic.swift
      - path: Sources/Model/FolderSizeInvalidation.swift
      - path: Sources/Model/MoveProgressLogic.swift
      # 智能清理进阶：开发缓存白名单、重复文件分组和保留哪份、已删 App 残留、旧 node_modules。
      - path: Sources/Model/DevCacheLogic.swift
      - path: Sources/Model/DuplicateGroupingLogic.swift
      - path: Sources/Model/OrphanLogic.swift
      - path: Sources/Model/NodeModulesLogic.swift
      # 找文件更快：可输入地址栏、命令面板（拼音首字母）、简介里的校验值、快捷位置（收藏 / 起始位置）。
      - path: Sources/Model/AddressBarLogic.swift
      - path: Sources/Search/CommandPaletteLogic.swift
      - path: Sources/Model/HashLogic.swift
      - path: Sources/Model/FavoritesLogic.swift
      # 右键菜单补齐：打开方式、终端 / 编辑器、替身 / 新建文件夹起名、剪切粘贴、直接删除文案；图片筛选和主色。
      - path: Sources/Model/ContextMenuLogic.swift
      # 右键菜单打开后内容不再变（beta.5 真机 macOS 27 右键崩溃）：只接右键的透明层 + NSHostingMenu 快照。
      - path: Sources/Views/StableContextMenuHost.swift
      - path: Sources/Model/ImageFilterLogic.swift
      # 拾掇 Pro 菜单与快捷键：右键菜单布局（排序 / 隐藏 / 分组 / 和新版本默认合并）、自定义快捷键（冲突、交换、存取）。
      - path: Sources/Model/MenuLayoutLogic.swift
      - path: Sources/Model/ShortcutSettingsLogic.swift
      # Pro 加值：压缩包浏览（zip 目录 / GBK 名字 / ZIP64、系统 tar 列表、解压）、批量改名规则引擎、新建文件模板。
      - path: Sources/Pro/ArchiveLogic.swift
      - path: Sources/Pro/ArchiveExtract.swift
      - path: Sources/Pro/RenameEngine.swift
      - path: Sources/Pro/FileTemplateLogic.swift
      # 字体管理：路径安全规则、重复 / 多版本分组、停用清单、字体集绑定、中文字体判断。
      - path: Sources/Model/FontLogic.swift
      # 外观：设置存取（容错解码）、字号范围、主题色、缩略图规则、透视文件夹挑最新几张、备选应用图标排序。
      - path: Sources/Model/AppearanceLogic.swift
      # 备选应用图标交给程序坞前重新画成 RGBA（调色板 PNG 直接给程序坞不可靠）。
      - path: Sources/Model/AppIconImage.swift
      # 备份到硬盘（Pro）：配对存取、认盘、比较、方向（只 Mac → 硬盘）、删除闸门、执行器。
      - path: Sources/Model/FolderBackupLogic.swift
      # 性能实测（Perf* 测试）用到的真实代码：读文件夹、排序、缩略图、性能打点。
      - path: Sources/Model/FileItem.swift
      - path: Sources/Model/FileSortKey.swift
      - path: Sources/Model/FolderListing.swift
      - path: Sources/Services/PerfLog.swift
      - path: Sources/Services/ThumbnailService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hanson-zz.shiduo.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shiduo:
    build:
      targets:
        Shiduo: all
    test:
      targets:
        - ShiduoTests
