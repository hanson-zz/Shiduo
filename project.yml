name: Shiduo
options:
  bundleIdPrefix: io.github.hanson-zz
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.13.3"
    CURRENT_PROJECT_VERSION: "23"
    DEAD_CODE_STRIPPING: YES
    # 界面支持简体中文和英文：代码里的中文是 key，英文翻译在 Resources/Localizable.xcstrings。
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # 默认 ad-hoc 签名（"-"），不需要 Apple 开发者证书，任何人 clone 后都能直接构建。
    # 发布的版本会再用固定的自签名证书重新签名（scripts/sign-app.sh），这样更新后系统权限不会丢，见 notes/signing.md。
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Shiduo:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Shiduo
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hanson-zz.shiduo
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShiduoTests:
    type: bundle.unit-test
    platform: macOS
    # 只编译纯逻辑部分（自然语言搜索解析），不需要启动整个应用。
    sources:
      - path: Tests
      - path: Sources/Search/SearchQuery.swift
      - path: Sources/Search/QueryParser.swift
      - path: Sources/Search/SavedSearch.swift
      - path: Sources/Search/Pinyin.swift
      - path: Sources/Model/FileCategory.swift
      - path: Sources/Model/SourceCatalog.swift
      - path: Sources/Model/FileStamp.swift
      - path: Sources/Model/PathLogic.swift
      - path: Sources/Model/FolderSizeLogic.swift
      - path: Sources/Model/ListTruncationLogic.swift
      - path: Sources/Model/NavigationHistoryLogic.swift
      - path: Sources/App/AppShortcuts.swift
      - path: Sources/Services/DuplicateSafety.swift
      - path: Sources/Services/OCRCacheKeys.swift
      - path: Sources/Pro/PhotoConcepts.swift
      - path: Sources/Pro/License.swift
      - path: Sources/Pro/TrialLogic.swift
      - path: Sources/Pro/ShakeDetector.swift
      - path: Sources/Services/CleanupHistory.swift
      - path: Sources/Pro/FolderIconStyle.swift
      - path: Sources/Services/FinderTagEntries.swift
      - path: Sources/Pro/MediaToolsLogic.swift
      - path: Sources/Pro/UninstallLogic.swift
      - path: Sources/Pro/StitchLogic.swift
      - path: Sources/Pro/AnnotateLogic.swift
      - path: Sources/Pro/ImageExportLogic.swift
      - path: Sources/Pro/ShortcutLogic.swift
      - path: Sources/Pro/MoveOutLogic.swift
      - path: Sources/Pro/DownloadsPlanLogic.swift
      - path: Sources/Services/FileUndoLogic.swift
      - path: Sources/Model/TodayAddedLogic.swift
      - path: Sources/Pro/UnlockCelebrationLogic.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hanson-zz.shiduo.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shiduo:
    build:
      targets:
        Shiduo: all
    test:
      targets:
        - ShiduoTests
